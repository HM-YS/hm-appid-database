name: 获取 Steam 数据
run-name: 获取并更新 Steam AppID 数据

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: npm ci

      - name: 获取 Steam AppID 数据
        run: node index.js
        env:
          STEAM_KEY: ${{ secrets.STEAM_KEY }}

      - name: 提交并推送数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "没有数据变化，无需提交"
            exit 0
          fi

          git commit -m "Update Steam AppID data"
          git push